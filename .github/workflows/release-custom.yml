name: release-custom

on:
  push:
    branches:
      - my-custom-release

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - name: Get next version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPSTREAM=$(gh release list --repo anomalyco/opencode --json tagName --jq '.[].tagName' 2>/dev/null | sed 's/^v//' | sort -V | tail -1 || echo "")
          CUSTOM=$(gh release list --repo JeongEEE/opencode --json tagName --jq '.[].tagName' 2>/dev/null | sed 's/^v//' | sort -V | tail -1 || echo "")

          UPSTREAM=${UPSTREAM#v}
          CUSTOM=${CUSTOM#v}

          IFS='.' read -r u_major u_minor u_patch <<< "${UPSTREAM:-1.4.3}"
          IFS='.' read -r c_major c_minor c_patch <<< "${CUSTOM:-0.0.0}"

          if [ -z "$CUSTOM" ]; then
            # 첫 릴리즈 — upstream 버전에서 시작
            echo "version=${u_major}.${u_minor}.${u_patch}" >> $GITHUB_OUTPUT
          elif [ "$u_major" -gt "$c_major" ] || { [ "$u_major" -eq "$c_major" ] && [ "$u_minor" -gt "$c_minor" ]; }; then
            # upstream의 major 또는 minor가 높아짐 — 맞춰서 올림
            echo "version=${u_major}.${u_minor}.0" >> $GITHUB_OUTPUT
          else
            # 동일한 major.minor — patch만 증가
            echo "version=${c_major}.${c_minor}.$((c_patch + 1))" >> $GITHUB_OUTPUT
          fi

      - name: Build
        working-directory: packages/opencode
        run: bun run script/build.ts
        env:
          OPENCODE_VERSION: ${{ steps.version.outputs.version }}

      - name: Package darwin binaries
        working-directory: packages/opencode/dist
        run: |
          (cd opencode-darwin-arm64/bin && zip -r ../../opencode-darwin-arm64.zip *)
          (cd opencode-darwin-x64/bin && zip -r ../../opencode-darwin-x64.zip *)
          (cd opencode-darwin-x64-baseline/bin && zip -r ../../opencode-darwin-x64-baseline.zip *)

      - name: Package linux binaries
        working-directory: packages/opencode/dist
        run: |
          (cd opencode-linux-x64/bin && tar -czf ../../opencode-linux-x64.tar.gz *)
          (cd opencode-linux-arm64/bin && tar -czf ../../opencode-linux-arm64.tar.gz *)
          (cd opencode-linux-x64-baseline/bin && tar -czf ../../opencode-linux-x64-baseline.tar.gz *)

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          prerelease: false
          make_latest: true
          files: |
            packages/opencode/dist/opencode-darwin-arm64.zip
            packages/opencode/dist/opencode-darwin-x64.zip
            packages/opencode/dist/opencode-darwin-x64-baseline.zip
            packages/opencode/dist/opencode-linux-x64.tar.gz
            packages/opencode/dist/opencode-linux-arm64.tar.gz
            packages/opencode/dist/opencode-linux-x64-baseline.tar.gz
            install
